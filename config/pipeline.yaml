# GeneEssentiality data pipeline configuration.
#
# All paths are relative to the project root unless absolute.
# Override at runtime: python scripts/run_pipeline.py --config config/custom.yaml

data:
  raw_dir: data/raw
  processed_dir: data/processed
  mvp_dir: data/mvp

extract_data:
  db_filename: feba.db
  raw_sequences_filename: aaseqs

classify_genes:
  confident_t_threshold: 1.0
  essentiality_fit_threshold: -1.0
  always_essential_frac: 0.8
  conditional_min_frac: 0.1

mvp_filter:
  media_prefixes: [LB, RCH2, M9]
  min_cor12: 0.2
  excluded_exp_groups: [plant]
  excluded_media: ["Potato Dextrose Broth"]

create_fastas:
  subsets: [processed, mvp]

embeddings:
  proteomelm_model: "Bitbol-Lab/ProteomeLM-L"
  device: "cuda:0"
  input_subdir: organism_fastas
  output_subdir: ProtLM_embeddings
  # Hidden layer to extract (0=embedding, 1..N=transformer layers). Use -1 for last layer.
  hidden_layer: 8
  # subset: "mvp" (default) or "processed". Input FASTAs from data/<subset>/organism_fastas.
  # To use the full processed dataset (48 organisms), set subset: processed (and in labels below).
  subset: processed

labels:
  # When using hidden_layer in embeddings, point these to the layer-specific folders:
  #   input_subdir: ProtLM_embeddings_layer8
  #   output_subdir: ProtLM_embeddings_with_labels_layer8
  input_subdir: ProtLM_embeddings_layer8
  output_subdir: ProtLM_embeddings_with_labels_layer8
  # subset: "mvp" (default) or "processed". Must match embeddings.subset.
  subset: processed
  class_to_int:
    always_essential: 0
    conditional: 1
    non_essential: 2
    no_data: -1
